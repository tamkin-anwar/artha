{% extends "base.html" %}
{% set hide_app_shell = true %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<main class="min-h-screen flex items-center justify-center px-4 py-14 auth-bg" role="main">
    <div class="w-full max-w-md">

        <div class="flex items-center justify-center gap-2 mb-6">
            <span class="inline-flex items-center justify-center w-[66px] h-[66px]">
                <img
                    src="{{ url_for('static', filename='icons/artha-logo.png') }}"
                    alt="Artha logo"
                    class="w-full h-full object-contain drop-shadow-md"
                    loading="eager"
                />
            </span>

            <div style="font-family:'Fraunces',serif; font-size:2.25rem; font-weight:600; color:var(--gold);">
                Artha
            </div>
        </div>

        <section class="rounded-2xl p-8 shadow-xl auth-card" aria-label="Edit profile form">
            <h1 style="font-family:'Fraunces',serif;" class="text-center text-2xl font-semibold text-white mb-6">
                Edit Profile
            </h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <script type="module">
                        import { showToast } from "{{ url_for('static', filename='js/toast.js') }}";
                        document.addEventListener('DOMContentLoaded', function () {
                            {% for category, message in messages %}
                                showToast({{ message|tojson }}, {{ category|tojson }});
                            {% endfor %}
                        });
                    </script>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.edit_profile') }}" class="space-y-4" role="form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="username_display" class="sr-only">Username</label>
                <input
                    id="username_display"
                    type="text"
                    value="{{ current_user.username }}"
                    class="w-full px-4 py-3 rounded-lg auth-input"
                    disabled
                    title="Username can't be changed here"
                />

                <label for="first_name" class="sr-only">First Name</label>
                <input
                    id="first_name"
                    name="first_name"
                    type="text"
                    autocomplete="given-name"
                    placeholder="First Name"
                    value="{{ current_user.first_name or '' }}"
                    class="w-full px-4 py-3 rounded-lg auth-input"
                    autofocus
                />

                <label for="last_name" class="sr-only">Last Name</label>
                <input
                    id="last_name"
                    name="last_name"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Last Name"
                    value="{{ current_user.last_name or '' }}"
                    class="w-full px-4 py-3 rounded-lg auth-input"
                />

                <label for="email" class="sr-only">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Email"
                    value="{{ current_user.email or '' }}"
                    class="w-full px-4 py-3 rounded-lg auth-input"
                    required
                />

                <button type="submit" class="w-full py-3 rounded-lg font-semibold auth-button">
                    Save Changes
                </button>
            </form>

            <p class="text-center text-sm mt-5 text-slate-300">
                <a href="{{ url_for('dashboard.index') }}" class="auth-link">
                    Back to dashboard
                </a>
            </p>
        </section>
    </div>
</main>
{% endblock %}
