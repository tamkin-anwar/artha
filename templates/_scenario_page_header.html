<div class="flex flex-wrap items-start justify-between gap-4 mb-8">
    <div>
        <div class="eyebrow" style="margin-bottom:6px;">SCENARIOS</div>
        <h1 style="font-family:'Fraunces',serif; font-size:32px; font-weight:300; color:var(--text-primary); margin:0;">Scenario Simulator</h1>
        <p style="color:var(--text-secondary); font-size:14px; margin-top:4px;">Model any what-if before it touches your real money</p>
    </div>
    <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
        <button
            type="button"
            id="compare-open-btn"
            class="btn-secondary"
            style="padding:10px 16px; font-size:14px;{% if scenarios|length < 2 %} opacity:0.5; cursor:default;{% endif %}"
            {% if scenarios|length < 2 %}disabled title="Add at least 2 scenarios to compare"{% endif %}
        >
            Compare
        </button>
        <a
            href="{{ url_for('scenarios.add') }}"
            class="btn-primary"
            style="padding:10px 16px; font-size:14px; text-decoration:none;"
        >
            + New Scenario
        </a>
    </div>
</div>

<script type="application/json" id="scenario-compare-data">{{ compare_data|tojson }}</script>

<div id="compare-modal-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; padding:16px;">
    <div class="glass-card" style="width:100%; max-width:760px; max-height:85vh; overflow-y:auto; padding:24px; background:var(--bg-surface);">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
            <h2 style="font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--text-primary); margin:0;">Compare scenarios</h2>
            <button type="button" id="compare-modal-close" aria-label="Close" style="background:none; border:none; color:var(--text-muted); font-size:22px; line-height:1; cursor:pointer; padding:4px;">&times;</button>
        </div>
        <div id="compare-modal-body"></div>
    </div>
</div>
