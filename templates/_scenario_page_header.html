<div class="flex flex-wrap items-start justify-between gap-4 mb-8">
    <div>
        <div class="eyebrow" style="margin-bottom:6px;">SCENARIOS</div>
        <h1 style="font-family:'Fraunces',serif; font-size:32px; font-weight:300; color:var(--text-primary); margin:0;">Scenario Simulator</h1>
        <p style="color:var(--text-secondary); font-size:14px; margin-top:4px;">Model any what-if before it touches your real money</p>
    </div>
    <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
        {% if status_filter == "archived" %}
        <a href="{{ url_for('scenarios.index') }}" class="btn-secondary" style="padding:10px 16px; font-size:14px; text-decoration:none;">
            &larr; Back to scenarios
        </a>
        {% elif archived_count %}
        <a href="{{ url_for('scenarios.index', status='archived') }}" class="btn-secondary" style="padding:10px 16px; font-size:14px; text-decoration:none;">
            Archived ({{ archived_count }})
        </a>
        {% endif %}
        <button
            type="button"
            id="compare-open-btn"
            class="btn-secondary"
            style="padding:10px 16px; font-size:14px;{% if scenarios|length < 2 %} opacity:0.5; cursor:default;{% endif %}"
            {% if scenarios|length < 2 %}disabled title="Add at least 2 scenarios to compare"{% endif %}
        >
            Compare
        </button>
        <a
            href="{{ url_for('scenarios.add') }}"
            class="btn-primary"
            style="padding:10px 16px; font-size:14px; text-decoration:none;"
        >
            + New Scenario
        </a>
    </div>
</div>

<script type="application/json" id="scenario-compare-data">{{ compare_data|tojson }}</script>

<style>
    /* Same open/close pair every other modal in the app uses (see
       modal-fade-in/-pop-in and .modal-closing in style.css) -- this one
       used to toggle a bare Tailwind .hidden class plus an inline
       style.display, with no animation either way. An author style's
       display always beats [hidden]'s UA default at equal specificity
       (the same trap CLAUDE.md documents elsewhere), so display:flex is
       scoped to :not([hidden]) rather than set unconditionally. */
    #compare-modal-overlay:not([hidden]) {
        display: flex; align-items: center; justify-content: center;
        animation: modal-fade-in 0.15s ease-out;
    }
    #compare-modal-overlay.modal-closing { animation: modal-fade-out 0.15s ease-in forwards; }
    #compare-modal-overlay.modal-closing > .glass-card { animation: modal-pop-out 0.15s cubic-bezier(0.4,0,1,1) forwards; }
    #compare-modal-overlay > .glass-card { animation: modal-pop-in 0.18s cubic-bezier(0.16,1,0.3,1); }
    /* Close (X) button had no hover/press feedback at all -- inline
       styles only. */
    #compare-modal-close { transition: color 0.12s ease, transform 0.12s ease; }
    #compare-modal-close:hover { color: var(--text-primary); }
    #compare-modal-close:active { transform: scale(0.85); }
    @media (prefers-reduced-motion: reduce) {
        #compare-modal-overlay:not([hidden]),
        #compare-modal-overlay.modal-closing,
        #compare-modal-overlay > .glass-card,
        #compare-modal-overlay.modal-closing > .glass-card {
            animation: none !important;
        }
    }
</style>
<div id="compare-modal-overlay" hidden style="position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:100; padding:16px;">
    <div class="glass-card scrollbar-thin" style="width:100%; max-width:760px; max-height:85vh; overflow-y:auto; padding:24px; background:var(--bg-surface);">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
            <h2 style="font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--text-primary); margin:0;">Compare scenarios</h2>
            <button type="button" id="compare-modal-close" aria-label="Close" style="background:none; border:none; color:var(--text-muted); line-height:0; cursor:pointer; padding:4px; display:flex;">
                <i data-lucide="x" aria-hidden="true" style="width:18px; height:18px; stroke-width:1.75;"></i>
            </button>
        </div>
        <div id="compare-modal-body"></div>
    </div>
</div>
