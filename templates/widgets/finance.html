<div class="finance-tab glass-card" style="padding:24px;">
    <form
        method="POST"
        action="{{ url_for('finance.add_transaction') }}"
        class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center"
        style="margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border-subtle);"
        autocomplete="off"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="text"
            name="description"
            placeholder="Description"
            required
            class="field-input w-full min-w-0 sm:col-span-4 h-11 text-sm"
        >

        <div class="tx-amount-group w-full min-w-0 sm:col-span-3 h-11 text-sm">
            <select
                name="currency"
                aria-label="Currency"
                class="tx-add-currency-select"
            >
                <option value="USD" {{ "selected" if (current_user.preferred_currency or "USD") == "USD" }}>$ USD</option>
                <option value="GBP" {{ "selected" if current_user.preferred_currency == "GBP" }}>£ GBP</option>
                <option value="BDT" {{ "selected" if current_user.preferred_currency == "BDT" }}>৳ BDT</option>
                <option value="EUR" {{ "selected" if current_user.preferred_currency == "EUR" }}>€ EUR</option>
                <option value="CAD" {{ "selected" if current_user.preferred_currency == "CAD" }}>$ CAD</option>
                <option value="AUD" {{ "selected" if current_user.preferred_currency == "AUD" }}>$ AUD</option>
            </select>

            <input
                type="number"
                name="amount"
                placeholder="Amount"
                step="0.01"
                inputmode="decimal"
                required
                class="tx-amount-input"
            >
        </div>

        <select
            name="type"
            required
            class="field-input w-full min-w-0 sm:col-span-3 h-11 text-sm"
        >
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <button
            type="submit"
            class="btn-primary w-full sm:col-span-2 h-11 px-5 text-sm flex items-center justify-center whitespace-nowrap"
        >
            Add
        </button>
    </form>

    <ul id="tx-list" class="space-y-3">
        {% for tx in transactions %}
            {% include "partials/transaction_row.html" %}
        {% else %}
            <li style="text-align:center; padding:24px 0; font-size:14px; color:var(--text-secondary);">
                No transactions yet.
            </li>
        {% endfor %}
    </ul>

    <div class="text-legend" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-subtle); font-size:14px; display:flex; flex-direction:column; gap:6px;">
        <p style="display:flex; align-items:center; gap:6px; margin:0;">
            <i data-lucide="arrow-up" aria-hidden="true" style="width:13px; height:13px; stroke-width:2; color:var(--emerald); flex-shrink:0;"></i>
            <span style="flex:1; min-width:0;">Income:
                <strong
                    id="finance-income"
                    class="finance-income"
                    data-money-value="{{ income }}"
                >${{ "%.2f"|format(income) }}</strong>
                <span style="font-size:11px; color:var(--text-muted);">· This month</span>
            </span>
        </p>

        <p style="display:flex; align-items:center; gap:6px; margin:0;">
            <i data-lucide="arrow-down" aria-hidden="true" style="width:13px; height:13px; stroke-width:2; color:var(--red); flex-shrink:0;"></i>
            <span style="flex:1; min-width:0;">Expense:
                <strong
                    id="finance-expense"
                    class="finance-expense"
                    data-money-value="{{ expense }}"
                >${{ "%.2f"|format(expense) }}</strong>
                <span style="font-size:11px; color:var(--text-muted);">· This month</span>
            </span>
        </p>

        <p style="display:flex; align-items:center; gap:6px; margin:0;">
            <i data-lucide="trending-up" aria-hidden="true" style="width:13px; height:13px; stroke-width:2; color:var(--gold); flex-shrink:0;"></i>
            <span style="flex:1; min-width:0;">Balance:
                <strong
                    id="finance-balance"
                    class="finance-balance"
                    data-money-value="{{ balance }}"
                >${{ "%.2f"|format(balance) }}</strong>
                <span style="font-size:11px; color:var(--text-muted);">· This month</span>
            </span>
        </p>
    </div>
</div>
